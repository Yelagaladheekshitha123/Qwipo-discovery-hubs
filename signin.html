<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Qwipo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-white to-blue-100 p-4">
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_left,_var(--tw-gradient-stops))] from-blue-200/30 via-white/10 to-blue-50/20"></div>
  <div class="w-full max-w-md relative z-10 shadow-xl border-0 rounded-2xl backdrop-blur-md bg-white/90 font-sans border-blue-200/50">
    <div class="text-center space-y-1 p-6">
      <h1 class="text-4xl font-bold text-blue-800">Welcome Back</h1>
      <p class="text-blue-600 font-semibold text-lg">Sign in to your Qwipo account</p>
    </div>
    <div class="p-6 space-y-4">
      <form id="signInForm" class="space-y-4">
        <div class="relative">
          <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 text-blue-500 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
          <label for="email" class="sr-only">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required class="pl-12 px-4 py-3 w-full font-normal text-base border border-blue-200 rounded-xl focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition-all duration-200">
          <span class="text-sm text-red-500 hidden" id="emailError"></span>
        </div>
        <div class="relative">
          <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 text-blue-500 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
          <label for="password" class="sr-only">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required minlength="6" class="pl-12 px-4 py-3 w-full font-normal text-base border border-blue-200 rounded-xl focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition-all duration-200">
          <span class="text-sm text-red-500 hidden" id="passwordError"></span>
        </div>
        <span class="text-sm text-red-500 hidden" id="errorMessage"></span>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg py-3 rounded-xl shadow-lg transition-all duration-200 transform hover:scale-105">Sign In</button>
      </form>
      <div class="text-center pt-4">
        <p class="text-sm text-gray-600 font-normal">
          Don't have an account? <a href="register.html" class="text-blue-600 hover:text-blue-800 underline font-semibold">Register</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('signInForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Reset errors
      document.querySelectorAll('span[id$="Error"]').forEach(span => span.classList.add('hidden'));
      document.getElementById('errorMessage').classList.add('hidden');

      let valid = true;

      if (!email.includes('@')) {
        document.getElementById('emailError').textContent = 'Invalid email address';
        document.getElementById('emailError').classList.remove('hidden');
        valid = false;
      }

      if (password.length < 6) {
        document.getElementById('passwordError').textContent = 'Password must be at least 6 characters';
        document.getElementById('passwordError').classList.remove('hidden');
        valid = false;
      }

      if (valid) {
        // Check if user exists in localStorage
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        const foundUser = users.find(u => u.email === email && u.password === password);
        if (foundUser) {
          localStorage.setItem('currentUser', JSON.stringify(foundUser));
          alert('Sign in successful! Redirecting to home...');
          window.location.href = '/home';
        } else {
          document.getElementById('errorMessage').textContent = 'Invalid email or password. Please register first.';
          document.getElementById('errorMessage').classList.remove('hidden');
        }
      } else {
        document.getElementById('errorMessage').textContent = 'Invalid email or password';
        document.getElementById('errorMessage').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
