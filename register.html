<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Qwipo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-100 via-blue-200 to-blue-400 p-4">
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_right,_var(--tw-gradient-stops))] from-blue-300/40 via-transparent to-blue-500/20"></div>
  <div class="w-full max-w-md relative z-10 shadow-xl border-0 rounded-2xl backdrop-blur-md bg-white/90 font-sans border-blue-300/50">
    <div class="text-center space-y-1 p-6">
      <h1 class="text-4xl font-bold text-blue-800">Create Account</h1>
      <p class="text-blue-600 font-semibold text-lg">Join Qwipo today and discover amazing content!</p>
    </div>
    <div class="p-6 space-y-4">
      <form id="registerForm" class="space-y-4">
        <div class="relative">
          <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 text-blue-500 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          <label for="name" class="sr-only">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required minlength="2" class="pl-12 px-4 py-3 w-full font-normal text-base border border-blue-200 rounded-xl focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition-all duration-200">
          <span class="text-sm text-red-500 hidden" id="nameError"></span>
        </div>
        <div class="relative">
          <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 text-blue-500 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
          <label for="email" class="sr-only">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required class="pl-12 px-4 py-3 w-full font-normal text-base border border-blue-200 rounded-xl focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition-all duration-200">
          <span class="text-sm text-red-500 hidden" id="emailError"></span>
        </div>
        <div class="relative">
          <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 text-blue-500 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
          <label for="password" class="sr-only">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required minlength="6" class="pl-12 px-4 py-3 w-full font-normal text-base border border-blue-200 rounded-xl focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition-all duration-200">
          <span class="text-sm text-red-500 hidden" id="passwordError"></span>
        </div>
        <div class="relative">
          <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 text-blue-500 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
          <label for="confirmPassword" class="sr-only">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required class="pl-12 px-4 py-3 w-full font-normal text-base border border-blue-200 rounded-xl focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition-all duration-200">
          <span class="text-sm text-red-500 hidden" id="confirmPasswordError"></span>
        </div>
        <span class="text-sm text-red-500 hidden" id="errorMessage"></span>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg py-3 rounded-xl shadow-lg transition-all duration-200 transform hover:scale-105">Create Account</button>
      </form>
      <div class="text-center pt-4">
        <p class="text-sm text-gray-600 font-normal">
          Already have an account? <a href="signin.html" class="text-blue-600 hover:text-blue-800 underline font-semibold">Sign in here</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Reset errors
      document.querySelectorAll('span[id$="Error"]').forEach(span => span.classList.add('hidden'));
      document.getElementById('errorMessage').classList.add('hidden');

      let valid = true;

      if (name.length < 2) {
        document.getElementById('nameError').textContent = 'Name must be at least 2 characters';
        document.getElementById('nameError').classList.remove('hidden');
        valid = false;
      }

      if (!email.includes('@')) {
        document.getElementById('emailError').textContent = 'Invalid email address';
        document.getElementById('emailError').classList.remove('hidden');
        valid = false;
      }

      if (password.length < 6) {
        document.getElementById('passwordError').textContent = 'Password must be at least 6 characters';
        document.getElementById('passwordError').classList.remove('hidden');
        valid = false;
      }

      if (password !== confirmPassword) {
        document.getElementById('confirmPasswordError').textContent = "Passwords don't match";
        document.getElementById('confirmPasswordError').classList.remove('hidden');
        valid = false;
      }

      if (valid) {
        // Check if user already exists
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        const existingUser = users.find(u => u.email === email);
        if (existingUser) {
          document.getElementById('errorMessage').textContent = 'User already exists. Please sign in.';
          document.getElementById('errorMessage').classList.remove('hidden');
        } else {
          const newUser = { name, email, password };
          users.push(newUser);
          localStorage.setItem('users', JSON.stringify(users));
          alert('Registration successful! Redirecting to sign in...');
          window.location.href = 'signin.html';
        }
      }
    });
  </script>
</body>
</html>
